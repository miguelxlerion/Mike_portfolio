# Cloudflare Workers Static Assets (mike-portfolio)
# Build: npm run build
# Deploy: npx wrangler deploy
#
# La presencia de este archivo evita que Workers Builds ejecute
# `astro add cloudflare` automáticamente. El sitio es 100% estático.
name = "mike-portfolio"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
