# Cloudflare Worker + assets estáticos (mike-portfolio)
# Deploy conectado a git: Build `npm run build`, Deploy `npx wrangler deploy`.
# El Worker sirve dist/ y responde /api/github y /api/contact.
#
# Variables (dashboard del Worker → Settings → Variables and Secrets):
#   GITHUB_TOKEN (opcional, sube el rate-limit de la API a 5000 req/h)
#   TRANSLATE_API_KEY (Google Cloud Translation: lote oficial sin throttling;
#     calentar todo el sitio cuesta ~$0.40 una vez, luego tira de caché edge)
#   RESEND_API_KEY (para que /api/contact envíe emails de verdad)
#   CONTACT_TO (destinatario, por defecto miguelxlerion@gmail.com)
#   TURNSTILE_SECRET (opcional, anti-spam del formulario)
name = "mike-portfolio"
compatibility_date = "2026-10-01"
main = "worker/index.ts"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
