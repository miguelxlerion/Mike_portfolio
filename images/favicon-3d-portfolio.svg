<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#05070d" stroke="url(#grad)" stroke-width="1.5"/>
  <!-- Wireframe cube (isometric) -->
  <g stroke="url(#grad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front face -->
    <path d="M8 18 L8 10 L16 6 L24 10 L24 18 L16 22 Z"/>
    <!-- Back face (top edges) -->
    <path d="M8 18 L16 22 L24 18" opacity="0.4"/>
    <!-- Vertical edges -->
    <path d="M8 10 L8 18" opacity="0.6"/>
    <path d="M24 10 L24 18" opacity="0.6"/>
    <path d="M16 6 L16 22" opacity="0.4"/>
  </g>
  <!-- Particle dots -->
  <g fill="url(#grad)">
    <circle cx="6" cy="26" r="1.2" opacity="0.8"/>
    <circle cx="26" cy="6" r="1" opacity="0.6"/>
    <circle cx="28" cy="24" r="0.8" opacity="0.5"/>
  </g>
</svg>