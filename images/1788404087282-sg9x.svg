<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" role="img" aria-labelledby="title desc">
<title>Urban Twin — Smart City</title>
<desc>Logo Urban Twin por Miguel Rodriguez Martinez — Smart City Twin con globo y edificios gemelos</desc>
<rect width="640" height="120" rx="16" fill="#0F172A"/>
<!-- Icono twin -->
<g transform="translate(16,16)">
  <rect width="88" height="88" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <!-- Globo base -->
  <circle cx="44" cy="44" r="28" fill="none" stroke="#4F8CFF" stroke-width="1.6" opacity="0.9"/>
  <ellipse cx="44" cy="44" rx="14" ry="28" fill="none" stroke="#4F8CFF" stroke-width="1" opacity="0.35"/>
  <ellipse cx="44" cy="44" rx="28" ry="10" fill="none" stroke="#4F8CFF" stroke-width="1" opacity="0.35"/>
  <path d="M 16 44 H 72" stroke="#4F8CFF" stroke-width="1" opacity="0.3"/>
  <!-- Edificios gemelos isométricos -->
  <!-- Edificio trasero -->
  <g opacity="0.95">
    <path d="M 28 58 L 40 50 L 52 58 L 52 72 L 40 80 L 28 72 Z" fill="#334155" stroke="#4F8CFF" stroke-width="1.1"/>
    <path d="M 28 58 L 40 50 L 40 80 L 28 72 Z" fill="#1E293B"/>
    <path d="M 40 50 L 52 58 L 52 72 L 40 80 Z" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <!-- ventanas -->
    <rect x="34" y="60" width="4" height="6" rx="0.5" fill="#4F8CFF" opacity="0.9"/>
    <rect x="42" y="60" width="4" height="6" rx="0.5" fill="#4F8CFF" opacity="0.6"/>
  </g>
  <!-- Edificio frontal -->
  <g>
    <path d="M 42 54 L 56 44 L 70 54 L 70 74 L 56 84 L 42 74 Z" fill="#4F8CFF" stroke="white" stroke-width="1.1"/>
    <path d="M 42 54 L 56 44 L 56 84 L 42 74 Z" fill="#3B82F6"/>
    <path d="M 56 44 L 70 54 L 70 74 L 56 84 Z" fill="#1E3A8A" opacity="0.9"/>
    <rect x="48" y="58" width="5" height="7" rx="0.5" fill="white" opacity="0.95"/>
    <rect x="58" y="58" width="5" height="7" rx="0.5" fill="white" opacity="0.85"/>
    <rect x="48" y="68" width="5" height="7" rx="0.5" fill="white" opacity="0.75"/>
    <rect x="58" y="68" width="5" height="7" rx="0.5" fill="white" opacity="0.65"/>
  </g>
  <!-- Brillo twin -->
  <circle cx="62" cy="22" r="2.2" fill="white" opacity="0.95"/>
  <circle cx="62" cy="22" r="5" fill="white" opacity="0.12"/>
</g>
<!-- Texto -->
<text x="122" y="54" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="38" font-weight="800" letter-spacing="0.06em" fill="#F8FAFC">URBAN <tspan fill="#4F8CFF">TWIN</tspan></text>
<text x="122" y="78" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.28em" fill="#94A3B8">SMART CITY</text>
<line x1="122" y1="86" x2="520" y2="86" stroke="#334155" stroke-width="1"/>
<text x="122" y="102" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.14em" fill="#64748B">MIGUEL RODRIGUEZ MARTINEZ</text>
</svg>
